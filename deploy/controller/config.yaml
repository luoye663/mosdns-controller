server:
  public_listen: "0.0.0.0:8080"
  internal_listen: "0.0.0.0:8081"
  trusted_proxies: []

storage:
  path: "/var/lib/mosdns-controller/controller.db"

mosdns:
  base_url: "http://mosdns:9091"
  token_file: "/run/secrets/mosdns_control_token"

web:
  secure_cookie: false
  session_ttl: "24h"

http:
  max_body_bytes: 67108864
  timeout: "30s"
