# 本地开发配置：仅监听回环地址，避免暴露管理接口到局域网。
server:
  public_listen: "127.0.0.1:18080"
  internal_listen: "127.0.0.1:18081"
  trusted_proxies: []

storage:
  path: "../.local/controller/controller.db"

mosdns:
  base_url: "http://127.0.0.1:19091"
  token_file: "../.local/mosdns_control_token"

web:
  secure_cookie: false
  session_ttl: "24h"

http:
  max_body_bytes: 67108864
  timeout: "30s"
