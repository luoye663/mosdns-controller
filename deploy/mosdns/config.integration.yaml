log:
  level: info
api:
  http: "0.0.0.0:9091"

plugins:
  - tag: geosite_cn
    type: domain_set
    args:
      exps: []
  - tag: dynamic_rules
    type: dynamic_rule_engine
    args:
      snapshot_file: "/var/lib/mosdns/dynamic-rules.json"
      backup_file: "/var/lib/mosdns/dynamic-rules.json.bak"
      auth_token_file: "/run/secrets/mosdns_control_token"
      fail_open_on_snapshot_error: true
  - tag: query_audit
    type: query_audit
    args:
      endpoint: "http://127.0.0.1:1/internal/v1/query-events/batch"
      auth_token_file: "/run/secrets/mosdns_control_token"
      queue_size: 32
      batch_size: 8
      flush_interval: "250ms"
      request_timeout: "100ms"
      max_retries: 0
      include_answers: false
  - tag: cache_local
    type: cache
    args:
      size: 64
      lazy_cache_ttl: 0
      auth_token_file: "/run/secrets/mosdns_control_token"
  - tag: cache_remote
    type: cache
    args:
      size: 64
      lazy_cache_ttl: 0
      auth_token_file: "/run/secrets/mosdns_control_token"
  - tag: local_dns
    type: forward
    args:
      upstreams:
        - addr: "udp://mock-local:53"
  - tag: remote_dns
    type: forward
    args:
      upstreams:
        - addr: "udp://mock-remote:53"
  - tag: route_local
    type: sequence
    args:
      - exec: mark 1101
      - exec: $cache_local
      - matches:
          - has_resp
        exec: mark 2101
      - matches:
          - has_resp
        exec: accept
      - exec: $local_dns
      - exec: accept
  - tag: route_remote
    type: sequence
    args:
      - exec: mark 1102
      - exec: $cache_remote
      - matches:
          - has_resp
        exec: mark 2101
      - matches:
          - has_resp
        exec: accept
      - exec: $remote_dns
      - exec: accept
  - tag: main
    type: sequence
    args:
      - exec: $query_audit
      - exec: $dynamic_rules
      - matches:
          - mark 1001
        exec: reject 3
      - matches:
          - mark 1101
        exec: goto route_local
      - matches:
          - mark 1102
        exec: goto route_remote
      - matches:
          - qname $geosite_cn
        exec: goto route_local
      - exec: goto route_remote
  - tag: udp_server
    type: udp_server
    args:
      entry: main
      listen: "0.0.0.0:5353"
  - tag: tcp_server
    type: tcp_server
    args:
      entry: main
      listen: "0.0.0.0:5353"
