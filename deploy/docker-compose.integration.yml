services:
  mock-default:
    image: coredns/coredns:1.12.0
    profiles: ["integration"]
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./integration/mock-default:/etc/coredns:ro
    networks: [integration]

  mosdns-integration:
    build:
      context: ../mosdns
      args:
        MOSDNS_BASE: v5.3.4
    profiles: ["integration"]
    command: ["start", "-c", "/etc/mosdns/config.integration.yaml"]
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mock-default
    ports:
      - "5353:5353/udp"
      - "5353:5353/tcp"
    volumes:
      - mosdns-integration-state:/var/lib/mosdns
      - ./mosdns/config.integration.yaml:/etc/mosdns/config.integration.yaml:ro
      - ./secrets:/run/secrets:ro
    networks: [integration]

volumes:
  mosdns-integration-state:

networks:
  integration:
    driver: bridge
