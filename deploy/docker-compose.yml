services:
  mosdns:
    image: luoye663/mosdns-manager:${MOSDNS_VERSION:-latest}
    command: ["start", "-c", "/etc/mosdns/config.yaml"]
    restart: unless-stopped
    init: true
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - mosdns-state:/var/lib/mosdns
      - ./mosdns/config.yaml:/etc/mosdns/config.yaml:ro

    secrets:
      - mosdns_control_token
    networks:
      - internal
#    healthcheck:
#      test: ["CMD", "/usr/local/bin/dns-healthcheck", "--server", "127.0.0.1:53", "--network", "udp"]
#      interval: 10s
#      timeout: 3s
#      retries: 3
#      start_period: 10s

  controller:
    image: luoye663/mosdns-controller:${MOSDNS_VERSION:-latest}
    command: ["serve", "-config", "/etc/mosdns-controller/config.yaml"]
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    ports:
      - "8080:8080/tcp"
    volumes:
      - controller-state:/var/lib/mosdns-controller
      - ./controller/config.yaml:/etc/mosdns-controller/config.yaml:ro
    secrets:
      - mosdns_control_token
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mosdns-state:
  controller-state:

networks:
  internal:
    driver: bridge

secrets:
  mosdns_control_token:
    file: ./secrets/mosdns_control_token
