server:
  public_listen: "0.0.0.0:8080"
  # Internal ingest must never be reachable from the LAN.
  internal_listen: "127.0.0.1:8081"
  trusted_proxies: []

storage:
  path: "/var/lib/mosdns-controller/controller.db"

mosdns:
  base_url: "http://127.0.0.1:9091"
  token_file: "/etc/mosdns-manager/mosdns_control_token"

web:
  secure_cookie: false
  session_ttl: "24h"

http:
  max_body_bytes: 67108864
  timeout: "30s"
